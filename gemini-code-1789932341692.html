<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caça-Palavras - Nomes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Quicksand, Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #292524;
            overscroll-behavior: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(180, 83, 9, 0.15);
            border: 3px solid #ffffff;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            color: #9a3412;
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            font-weight: 800;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        p.subtitle {
            color: #78350f;
            font-size: clamp(0.85rem, 2.8vw, 1rem);
            font-weight: 600;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #fff7ed;
            border: 2px solid #ffedd5;
            padding: 8px 12px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-weight: 700;
            color: #9a3412;
            font-size: clamp(0.85rem, 3vw, 1.05rem);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-item span {
            color: #c2410c;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 20px;
            align-items: start;
        }

        /* Tabuleiro */
        .grid-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
            border: 2px solid #fed7aa;
            touch-action: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 3px;
            width: 100%;
            max-width: 480px;
            touch-action: none;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.75rem, 3.2vw, 1.2rem);
            font-weight: 800;
            color: #44403c;
            background: #fff7ed;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.1s ease, transform 0.1s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            touch-action: none;
        }

        .cell.selecting {
            background: #38bdf8 !important;
            color: #ffffff !important;
            transform: scale(1.05);
        }

        .cell.found {
            animation: pulse 0.25s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Lista de Palavras */
        .words-panel {
            background: #fff7ed;
            padding: 14px;
            border-radius: 16px;
            border: 2px solid #fed7aa;
        }

        .words-panel h2 {
            font-size: 1rem;
            color: #9a3412;
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 2px dashed #fdba74;
            padding-bottom: 6px;
        }

        .words-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            list-style: none;
        }

        .word-item {
            padding: 6px 12px;
            background: #ffffff;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #57534e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1.5px solid #ffedd5;
            transition: all 0.2s ease;
        }

        .word-item.found {
            background: #dcfce7;
            color: #15803d;
            border-color: #86efac;
            text-decoration: line-through;
            opacity: 0.8;
        }

        .controls {
            margin-top: 16px;
            display: flex;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.96);
        }

        /* Modal Vitória */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1; pointer-events: all;
        }

        .modal {
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 24px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            border: 3px solid #f97316;
            transform: scale(0.85);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h2 {
            color: #ea580c;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .modal p {
            font-size: 1rem;
            color: #44403c;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Ajustes específicos para telas de Celular */
        @media (max-width: 768px) {
            .game-layout {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .words-list {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                gap: 6px;
            }
            .container {
                padding: 12px;
            }
            .grid-container {
                padding: 6px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>👥 Caça-Palavras</h1>
        <p class="subtitle">Encontre os 7 nomes no painel!</p>
    </header>

    <div class="stats-bar">
        <div class="stat-item">🔍 <strong id="found-count">0 / 7</strong></div>
        <div class="stat-item">⏱️ <strong id="timer">00:00</strong></div>
    </div>

    <div class="game-layout">
        <div class="grid-container">
            <div class="grid" id="grid"></div>
        </div>

        <div class="words-panel">
            <h2>📜 Nomes para Encontrar</h2>
            <ul class="words-list" id="words-list"></ul>
        </div>
    </div>

    <div class="controls">
        <button id="restart-btn">🔄 Novo Jogo</button>
    </div>
</div>

<div class="modal-overlay" id="win-modal">
    <div class="modal">
        <h2>🎉 Parabéns!</h2>
        <p id="win-stats">Você encontrou todos os nomes!</p>
        <button id="modal-restart-btn" style="margin: 0 auto;">Jogar Novamente</button>
    </div>
</div>

<script>
    const WORDS_DATA = [
        { word: 'MARCOS', display: 'Marcos', icon: '🧑' },
        { word: 'EDNILSON', display: 'Ednilson', icon: '👤' },
        { word: 'RAIDONEY', display: 'Raidoney', icon: '⭐' },
        { word: 'RICARDO', display: 'Ricardo', icon: '👨' },
        { word: 'MARISTELA', display: 'Maristela', icon: '👩' },
        { word: 'JOARA', display: 'Joara', icon: '🌟' },
        { word: 'AUGUSTO', display: 'Augusto', icon: '🙋‍♂️' }
    ];

    const PALETTE = [
        { bg: '#fde047', text: '#854d0e' },
        { bg: '#86efac', text: '#166534' },
        { bg: '#93c5fd', text: '#1e40af' },
        { bg: '#f472b6', text: '#831843' },
        { bg: '#fb923c', text: '#7c2d12' },
        { bg: '#c084fc', text: '#581c87' },
        { bg: '#6ee7b7', text: '#065f46' }
    ];

    const GRID_SIZE = 12;
    let gridMatrix = [];
    let placedWords = [];
    let foundWords = new Set();
    
    let isSelecting = false;
    let startCell = null;
    let currentSelection = [];

    let timerInterval = null;
    let secondsElapsed = 0;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.04);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.04);
                osc.start(now); osc.stop(now + 0.04);
            } else if (type === 'found') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(f, now + i*0.1);
                    g.gain.setValueAtTime(0.15, now + i*0.1);
                    g.gain.linearRampToValueAtTime(0.01, now + i*0.1 + 0.2);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.2);
                });
            }
        } catch (e) {}
    }

    function startTimer() {
        if (timerInterval) return;
        timerInterval = setInterval(() => {
            secondsElapsed++;
            const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const s = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }, 1000);
    }

    function initGame() {
        clearInterval(timerInterval);
        timerInterval = null;
        secondsElapsed = 0;
        document.getElementById('timer').textContent = '00:00';
        
        foundWords.clear();
        document.getElementById('found-count').textContent = `0 / ${WORDS_DATA.length}`;
        document.getElementById('win-modal').classList.remove('active');

        generateBoard();
        renderSidebar();
        renderGrid();
    }

    function generateBoard() {
        let success = false;
        while (!success) {
            gridMatrix = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));
            placedWords = [];
            success = true;

            for (let item of WORDS_DATA) {
                if (!placeWord(item)) {
                    success = false;
                    break;
                }
            }
        }

        const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (gridMatrix[r][c] === '') {
                    gridMatrix[r][c] = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
                }
            }
        }
    }

    function placeWord(wordObj) {
        const word = wordObj.word;
        const directions = [
            [0, 1],   // Horiz
            [1, 0],   // Vert
            [1, 1],   // Diag Baixo
            [-1, 1]   // Diag Cima
        ];
        
        const shuffledDirs = directions.sort(() => Math.random() - 0.5);

        for (let [dr, dc] of shuffledDirs) {
            let validPositions = [];

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let endR = r + dr * (word.length - 1);
                    let endC = c + dc * (word.length - 1);

                    if (endR >= 0 && endR < GRID_SIZE && endC >= 0 && endC < GRID_SIZE) {
                        let fits = true;
                        for (let i = 0; i < word.length; i++) {
                            let currR = r + dr * i;
                            let currC = c + dc * i;
                            if (gridMatrix[currR][currC] !== '' && gridMatrix[currR][currC] !== word[i]) {
                                fits = false;
                                break;
                            }
                        }
                        if (fits) validPositions.push({ r, c });
                    }
                }
            }

            if (validPositions.length > 0) {
                const pos = validPositions[Math.floor(Math.random() * validPositions.length)];
                let path = [];
                for (let i = 0; i < word.length; i++) {
                    let currR = pos.r + dr * i;
                    let currC = pos.c + dc * i;
                    gridMatrix[currR][currC] = word[i];
                    path.push({ r: currR, c: currC });
                }
                placedWords.push({
                    word: word,
                    display: wordObj.display,
                    path: path
                });
                return true;
            }
        }
        return false;
    }

    function renderSidebar() {
        const listEl = document.getElementById('words-list');
        listEl.innerHTML = '';
        WORDS_DATA.forEach(item => {
            const li = document.createElement('li');
            li.className = 'word-item';
            li.id = `word-${item.word}`;
            li.innerHTML = `
                <span>${item.display}</span>
                <span style="font-size:1.1rem">${item.icon}</span>
            `;
            listEl.appendChild(li);
        });
    }

    function renderGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.textContent = gridMatrix[r][c];

                // Mouse Eventos
                cell.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    startSelection(r, c);
                });
                cell.addEventListener('mouseenter', () => updateSelection(r, c));
                
                gridEl.appendChild(cell);
            }
        }

        // Touch Eventos otimizados para Celular
        gridEl.addEventListener('touchstart', handleTouchStart, { passive: false });
        gridEl.addEventListener('touchmove', handleTouchMove, { passive: false });
        gridEl.addEventListener('touchend', endSelection);
        gridEl.addEventListener('touchcancel', endSelection);
        window.addEventListener('mouseup', endSelection);
    }

    function handleTouchStart(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.classList.contains('cell')) {
            const r = parseInt(target.dataset.r);
            const c = parseInt(target.dataset.c);
            startSelection(r, c);
        }
    }

    function handleTouchMove(e) {
        if (!isSelecting) return;
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.classList.contains('cell')) {
            const r = parseInt(target.dataset.r);
            const c = parseInt(target.dataset.c);
            updateSelection(r, c);
        }
    }

    function startSelection(r, c) {
        startTimer();
        initAudio();
        isSelecting = true;
        startCell = { r, c };
        currentSelection = [{ r, c }];
        highlightSelection();
        playSound('select');
    }

    function updateSelection(r, c) {
        if (!isSelecting || !startCell) return;

        const dr = r - startCell.r;
        const dc = c - startCell.c;

        if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
            const steps = Math.max(Math.abs(dr), Math.abs(dc));
            const stepR = dr === 0 ? 0 : dr / steps;
            const stepC = dc === 0 ? 0 : dc / steps;

            currentSelection = [];
            for (let i = 0; i <= steps; i++) {
                currentSelection.push({
                    r: startCell.r + stepR * i,
                    c: startCell.c + stepC * i
                });
            }
            highlightSelection();
        }
    }

    function highlightSelection() {
        document.querySelectorAll('.cell.selecting').forEach(el => el.classList.remove('selecting'));
        currentSelection.forEach(pos => {
            const el = document.querySelector(`.cell[data-r="${pos.r}"][data-c="${pos.c}"]`);
            if (el) el.classList.add('selecting');
        });
    }

    function endSelection() {
        if (!isSelecting) return;
        isSelecting = false;

        const selectedWordStr = currentSelection.map(pos => gridMatrix[pos.r][pos.c]).join('');
        const reversedWordStr = selectedWordStr.split('').reverse().join('');

        let matched = placedWords.find(item => 
            !foundWords.has(item.word) && (item.word === selectedWordStr || item.word === reversedWordStr)
        );

        if (matched) {
            foundWords.add(matched.word);
            playSound('found');

            const colorObj = PALETTE[(foundWords.size - 1) % PALETTE.length];

            matched.path.forEach(pos => {
                const el = document.querySelector(`.cell[data-r="${pos.r}"][data-c="${pos.c}"]`);
                if (el) {
                    el.classList.add('found');
                    el.style.backgroundColor = colorObj.bg;
                    el.style.color = colorObj.text;
                }
            });

            const listEl = document.getElementById(`word-${matched.word}`);
            if (listEl) listEl.classList.add('found');

            document.getElementById('found-count').textContent = `${foundWords.size} / ${WORDS_DATA.length}`;

            if (foundWords.size === WORDS_DATA.length) {
                setTimeout(handleWin, 300);
            }
        }

        document.querySelectorAll('.cell.selecting').forEach(el => el.classList.remove('selecting'));
        currentSelection = [];
        startCell = null;
    }

    function handleWin() {
        clearInterval(timerInterval);
        playSound('win');
        const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const s = String(secondsElapsed % 60).padStart(2, '0');
        
        document.getElementById('win-stats').innerHTML = 
            `Você encontrou todos os <strong>${WORDS_DATA.length} nomes</strong><br>em <strong>${m}:${s}</strong>!`;
        document.getElementById('win-modal').classList.add('active');
    }

    document.getElementById('restart-btn').addEventListener('click', initGame);
    document.getElementById('modal-restart-btn').addEventListener('click', initGame);

    window.onload = initGame;
</script>
</body>
</html>
